<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
  </head>
  <body>
    <center>
      <h1>Sign up</h1>
      <p><h2>Fill in the form below to sign up for our services.</h2></p>
    </center>
    <center> 
    <div class="sign up"> 
      <form>
        <label>
          <h3>Full Name: <input type="text" name="name" /></h3>
          <p><h3>Email: <input type="email" name="email" /></p></h3>
          <p><h3>Password: <input type="password" name="password" /></p></h3>
          <p><h3>Confirm Password: <input type="password" name="confirm_password" /></p></h3>
          <p><h4><input type="checkbox" name="terms" required /> I agree to the terms and conditions.</h4></p>
        </label>
        <button type="submit">sign up</button>
      </form>
      </center>
      </div>
  </body>
</html>
